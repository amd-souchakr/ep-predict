[project]
name = "ep-predict"
version = "0.1.0"
description = "Hook-based expert routing traces and predictive MoE residency experiments"
readme = "README.md"
authors = [
    { name = "Sourav Chakraborty", email = "souravzzz@yahoo.co.in" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ep-predict = "ep_predict.cli:main"

[project.optional-dependencies]
data = [
    "datasets==4.4.1",
]
inference = [
    "accelerate==1.3.0",
    "torch==2.6.0",
    "transformers==5.14.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
